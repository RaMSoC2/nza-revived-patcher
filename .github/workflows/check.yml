name: Source checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify endpoint restrictions without internet
        run: |
          mkdir -p "$RUNNER_TEMP/nza-policy"
          javac --release 17 -d "$RUNNER_TEMP/nza-policy" src/android/compatibility/src/main/java/com/ramsoc2/nzarevived/NzaNetworkPolicy.java tests/NetworkPolicyTest.java
          java -cp "$RUNNER_TEMP/nza-policy" NetworkPolicyTest
          javac --release 17 -cp "$RUNNER_TEMP/nza-policy" -d "$RUNNER_TEMP/nza-policy" src/android/places-helper/src/main/java/com/ramsoc2/nzarevived/places/NzaOverpassTransport.java tests/OverpassTransportTest.java
          java -cp "$RUNNER_TEMP/nza-policy" com.ramsoc2.nzarevived.places.OverpassTransportTest
